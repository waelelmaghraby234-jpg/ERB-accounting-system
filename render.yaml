services:
  - type: web
    name: erp-accounting-system
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_GROUP_CODE
        value: GROUP001
      - key: ADMIN_GROUP_NAME
        value: Cairo Group Holding
      - key: AUTO_MIGRATE
        value: "true"
      - key: ALLOW_COMPANY_RESET
        value: "false"
      - key: ALLOW_TEST_UNPOST
        value: "false"

      - key: ALLOW_FULL_TRIAL_RESET
        value: "false"
